name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck

      - name: Install workflow linter
        env:
          GOBIN: /usr/local/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify vendored Grafonnet dependency
        run: test -f vendor/github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet

      - name: Check generated files are current
        run: make check-generated

      - name: Validate sources and generated artifacts
        run: make validate

      - name: Ensure validation did not rewrite committed artifacts
        run: git diff --exit-code -- generated manifests

      - name: Lint shell scripts
        run: shellcheck tests/*.sh scripts/*.sh

      - name: Lint GitHub Actions workflows
        run: actionlint

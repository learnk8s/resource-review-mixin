name: integration

on:
  pull_request:
    paths:
      - '.github/workflows/integration.yaml'
      - 'config.libsonnet'
      - 'dashboards/**'
      - 'jsonnetfile.json'
      - 'jsonnetfile.lock.json'
      - 'lib/**'
      - 'manifests/**'
      - 'rules/**'
      - 'tests/**'
      - 'vendor/**'
      - 'Makefile'
      - 'mixin.libsonnet'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
          version: v0.32.0

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0

      - name: Run kube-prometheus-stack integration
        run: ./tests/integration-kind.sh

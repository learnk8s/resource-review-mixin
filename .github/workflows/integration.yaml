name: integration

on:
  pull_request:
    paths:
      - '.github/workflows/integration.yaml'
      - 'config.libsonnet'
      - 'dashboards/**'
      - 'jsonnetfile.json'
      - 'jsonnetfile.lock.json'
      - 'lib/**'
      - 'manifests/**'
      - 'rules/**'
      - 'tests/**'
      - 'vendor/**'
      - 'Makefile'
      - 'mixin.libsonnet'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.32.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Run kube-prometheus-stack integration
        run: ./tests/integration-kind.sh

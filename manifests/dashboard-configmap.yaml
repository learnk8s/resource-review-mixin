"apiVersion": "v1"
"data":
  "resource-review.json": "{\n  \"annotations\": {\n    \"list\": [\n\n    ]\n  },\n  \"description\": \"Revision-safe evidence for the Kubernetes Rightsizing review process. This dashboard does not make resource recommendations.\",\n  \"editable\": false,\n  \"links\": [\n    {\n      \"icon\": \"external link\",\n      \"targetBlank\": true,\n      \"title\": \"Kubernetes Rightsizing book — review process this dashboard implements\",\n      \"type\": \"link\",\n      \"url\": \"https://learnkube.com/kubernetes-rightsizing\"\n    },\n    {\n      \"icon\": \"doc\",\n      \"targetBlank\": true,\n      \"title\": \"Metric definitions and limitations\",\n      \"type\": \"link\",\n      \"url\": \"https://github.com/learnk8s/resource-review-mixin/blob/main/docs/metrics.md\"\n    },\n    {\n      \"icon\": \"external link\",\n      \"targetBlank\": true,\n      \"title\": \"Open-source project sponsored by StormForge\",\n      \"type\": \"link\",\n      \"url\": \"https://stormforge.io/\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"description\": \"The dashboard follows the Kubernetes Rightsizing review sequence: establish evidence quality, compare replicas, then inspect CPU, memory, and failure signals.\",\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"id\": 1,\n      \"options\": {\n        \"content\": \"The time picker is the **observation window**. Start with history and coverage, compare replicas before aggregating them, then inspect CPU waiting and throttling, memory composition and pressure, restarts, and OOM evidence.\\n\\n**Missing**, **not configured**, and numerical **zero** are different states. Low usage in the selected history does not prove that a request or limit change is safe.\\n\",\n        \"mode\": \"markdown\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"title\": \"How to use this review\",\n      \"type\": \"text\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 4\n      },\n      \"id\": 10,\n      \"panels\": [\n\n      ],\n      \"title\": \"Review context\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Pod UIDs currently reported for the selected revisions. This is not the desired or Ready replica count.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 0,\n        \"y\": 5\n      },\n      \"id\": 19,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"count(count by (cluster, namespace, pod, uid) (resource_review:workload_revision_pod_container_info{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}))\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"Current Pods\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Current Pods\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Distinct Pod UIDs seen during the selected time window, including Pods that have since been replaced.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 4,\n        \"y\": 5\n      },\n      \"id\": 12,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"count(count by (cluster, namespace, pod, uid) (max_over_time(resource_review:workload_revision_pod_container_info{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])))\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"Pod executions\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Pod executions\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Distinct workload revisions seen during the selected time window. The detailed revision table shows how each revision was identified.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 8,\n        \"y\": 5\n      },\n      \"id\": 18,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"count(count by (cluster, namespace, workload_type, workload, revision, revision_source) (max_over_time(resource_review:workload_revision_pod_container_info{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])))\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"Revisions\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Revisions\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Nodes that ran the selected Pod executions during the time window. One node cannot reveal host-dependent differences.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 12,\n        \"y\": 5\n      },\n      \"id\": 17,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"count(count by (cluster, namespace, node) (max_over_time(resource_review:workload_revision_pod_container_info{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])))\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"Nodes\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Nodes\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"CPU history available for the least-observed selected replica. Missing one-minute rule samples shorten this value.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"s\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 16,\n        \"y\": 5\n      },\n      \"id\": 14,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"min(count_over_time(resource_review:container_cpu_usage_cores:rate5m{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])) * 60\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"History\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Shortest history\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Lowest share of expected one-minute CPU samples available for any selected replica in the time window.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 4,\n        \"x\": 20,\n        \"y\": 5\n      },\n      \"id\": 15,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"clamp_max(min(count_over_time(resource_review:container_cpu_usage_cores:rate5m{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])) / ($__range_s / 60), 1)\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"Coverage\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"CPU coverage\",\n      \"type\": \"stat\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 10\n      },\n      \"id\": 60,\n      \"panels\": [\n\n      ],\n      \"title\": \"Peak usage vs limits\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Highest sampled five-minute CPU usage in the selected time window as a percentage of the configured limit for each Pod and container. Omitted when no limit is configured. This is evidence about the configured ceiling, not a sizing recommendation.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [\n            {\n              \"options\": {\n                \"match\": \"null\",\n                \"result\": {\n                  \"color\": \"orange\",\n                  \"text\": \"No limit or evidence\"\n                }\n              },\n              \"type\": \"special\"\n            }\n          ],\n          \"max\": 1,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.8\n              }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 11\n      },\n      \"id\": 61,\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"showUnfilled\": true\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"(max_over_time(resource_review:container_cpu_usage_cores:rate5m{namespace=~\\\"$namespace\\\", workload_type
"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.8\n              }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": [\n\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 11\n      },\n      \"id\": 62,\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"showUnfilled\": true\n      },\n      \"pluginVersion\": \"v13.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"(max_over_time(resource_review:container_memory_usage_bytes{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])) / (last_over_time(resource_review:container_memory_limit_bytes{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range])) and on (cluster, namespace, pod, uid, container) (last_over_time(resource_review:container_memory_limit_bytes{namespace=~\\\"$namespace\\\", workload_type=~\\\"$workload_type\\\", workload=~\\\"$workload\\\", revision=~\\\"$revision\\\", pod=~\\\"$pod\\\", container=~\\\"$container\\\"}[$__range]) > 0)\",\n          \"format\": \"time_series\",\n          \"instant\": true,\n          \"legendFormat\": \"{{pod}} / {{container}}\",\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Peak memory as
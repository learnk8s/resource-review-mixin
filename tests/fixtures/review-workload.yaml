apiVersion: v1
kind: Namespace
metadata:
  name: resource-review-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-sample
  namespace: resource-review-test
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: review-sample
  template:
    metadata:
      labels:
        app: review-sample
    spec:
      containers:
        - name: app
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          env:
            - name: REVISION
              value: v1
          command:
            - sh
            - -c
            - |
              while true; do
                :
              done
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test "$REVISION" = v1
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failure-sample
  namespace: resource-review-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failure-sample
  template:
    metadata:
      labels:
        app: failure-sample
    spec:
      containers:
        - name: app
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -e /state/restart-attempted ]; then
                touch /state/restart-attempted
                exit 1
              fi
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 100m
              memory: 16Mi
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unconfigured-sample
  namespace: resource-review-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unconfigured-sample
  template:
    metadata:
      labels:
        app: unconfigured-sample
    spec:
      containers:
        - name: app
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - while true; do sleep 3600; done
